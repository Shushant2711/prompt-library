<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header><h1>Prompt Library</h1><button id="settingsBtn">Settings</button></header>
<main>
<aside>
  <div class="side-top"><input id="q" placeholder="Search templates"><button id="newBtn" class="primary">New</button></div>
  <ul id="list"></ul>
  <div class="side-bot"><button id="exportBtn">Export</button><button id="importBtn">Import</button><button id="delBtn">Delete</button></div>
</aside>
<section id="editor"></section>
</main>

<dialog id="dlg">
  <h3 style="font-family:var(--head);margin-top:0">API keys</h3>
  <p>Keys are saved only in this browser and sent only with your own test runs.</p>
  <label class="l">Anthropic key</label><input id="kA" class="field" type="password" placeholder="sk-ant-...">
  <label class="l">OpenAI key</label><input id="kO" class="field" type="password" placeholder="sk-...">
  <div class="bar" style="justify-content:flex-end"><button id="kClose">Cancel</button><button id="kSave" class="primary">Save keys</button></div>
</dialog>
<input id="file" type="file" accept="application/json" hidden>

<script src="/js/storage.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
